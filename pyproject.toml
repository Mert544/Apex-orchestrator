[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-orchestrator"
version = "0.1.0"
description = "Agents for fractal codebase intelligence, memory-aware reasoning, and branch-focused engineering workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
]

[project.scripts]
apex = "app.cli:main"
apex-mcp = "app.mcp.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pyflakes (F) catches real bugs (e.g. the undefined-name crash fixed this
# session). E402 is ignored: many modules intentionally place the module
# docstring after `from __future__ import annotations`, which is harmless.
select = ["E", "F", "W"]
ignore = ["E402", "E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/validation/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
