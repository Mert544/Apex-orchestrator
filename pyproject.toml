[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-orchestrator"
version = "0.1.0"
description = "Deterministic engineering agent: scan a codebase, generate a grounded roadmap, and apply test-verified fixes — offline, no LLM, no API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mert544", email = "mertelgul@gmail.com" }]
keywords = [
  "code-quality", "static-analysis", "security", "ast", "refactoring",
  "developer-tools", "ci", "code-review", "autofix", "deterministic",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Mert544/Apex-orchestrator"
Documentation = "https://mert544.github.io/Apex-orchestrator/"
Source = "https://github.com/Mert544/Apex-orchestrator"
Issues = "https://github.com/Mert544/Apex-orchestrator/issues"
Changelog = "https://github.com/Mert544/Apex-orchestrator/releases"

[project.scripts]
apex = "app.cli:main"
apex-mcp = "app.mcp.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "pytest-timeout>=2.1",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pyflakes (F) catches real bugs (e.g. the undefined-name crash fixed this
# session). E402 is ignored: many modules intentionally place the module
# docstring after `from __future__ import annotations`, which is harmless.
select = ["E", "F", "W"]
ignore = ["E402", "E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail any single test that hangs (>120s) with a traceback naming it, instead of
# letting it block CI for the full job timeout. Surfaced a CI-only hang in the
# Apex Security Audit workflow that unit runs didn't reproduce.
addopts = "--timeout=120"

[tool.coverage.run]
source = ["app"]
omit = ["app/validation/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
