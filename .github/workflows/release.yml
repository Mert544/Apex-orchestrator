name: Release to PyPI

# Push a tag like v0.1.0 and this workflow builds the package, publishes it to
# PyPI via Trusted Publishing (no API token or secret needed — configure the
# publisher once on pypi.org, see RELEASING.md), and attaches the artifacts to
# a GitHub Release. Creating that GitHub Release is also what lets you tick
# "Publish this Action to the GitHub Marketplace".

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/apex --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # optional: add manual approval in repo settings
    permissions:
      id-token: write          # Trusted Publishing — no PyPI token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
