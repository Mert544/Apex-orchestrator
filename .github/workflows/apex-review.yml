name: Apex Review

# Deterministic, offline PR review — no API keys, no per-token cost.
# Flags security/bug/style/docs issues on the *changed* lines and gates on
# high-severity findings. Drop this file into any Python repo to use it —
# it installs Apex from its own GitHub source automatically (see the
# ADOPTER branch of the "Install Apex" step below); it does not install your
# project. The SELF-REPO branch is only taken inside Apex's own CI.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  apex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need the base ref to diff against

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Apex
        # SELF-REPO (this workflow running inside Mert544/Apex-orchestrator's
        # own CI): install the checked-out source, dogfooding the exact code
        # under test — byte-identical to the pre-existing behavior.
        # ADOPTER (this file copied into another repo's .github/workflows/):
        # "pip install -e ." would install the ADOPTER's own project instead
        # of Apex — the `apex` console script would be missing (or a
        # same-named script from the target project would silently run in
        # its place). Install Apex itself from its pinned GitHub source
        # instead (a non-editable install: an adopter never needs an
        # editable install of a tool they didn't clone).
        env:
          APEX_ADOPTER_REF: main  # pin to a released tag/commit once Apex publishes one (see RELEASING.md)
        run: |
          if [ "${{ github.repository }}" = "Mert544/Apex-orchestrator" ]; then
            pip install -e .
          else
            pip install "git+https://github.com/Mert544/Apex-orchestrator@${APEX_ADOPTER_REF}"
          fi

      - name: Run Apex review on the diff
        id: review
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          # Full review into the job summary (the Actions UI holds large output).
          python -m app.cli review --base "$BASE" | tee review-full.md >> "$GITHUB_STEP_SUMMARY"
          # Bounded copy for the PR comment — GitHub caps a comment at 65 536
          # chars, and a wide diff against a long-running base can list
          # thousands of findings. The cap keeps the comment well under it.
          python -m app.cli review --base "$BASE" --max-findings 40 > review.md
          # Machine-readable copy for any downstream step.
          python -m app.cli review --base "$BASE" --json > review.json || true

      - name: Post review as a PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true  # a comment hiccup must never fail the review job
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try { body = fs.readFileSync('review.md', 'utf8'); } catch (e) { return; }
            if (!body.trim()) return;
            // Final guard: hard-cap below GitHub's 65 536-char comment limit.
            const LIMIT = 64000;
            if (body.length > LIMIT) {
              body = body.slice(0, LIMIT) +
                "\n\n_…truncated — see the full review in the workflow run summary._";
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Gate on high-severity issues
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          # Excludes fixture/test code: its flaws are intentional test data.
          python -m app.cli review --base "$BASE" --fail-on-high
