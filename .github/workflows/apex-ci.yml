name: Apex CI

# Deterministic, zero-token quality gate + code-scanning source.
#
# Apex runs fully offline: no API keys, no network calls, no per-token cost.
# On every pull request it (1) fails the build on a new finding or a regression
# and (2) publishes its deterministic findings to the GitHub Security tab as
# SARIF. Same diff in -> same verdict out, so the gate is reproducible in a way
# an LLM-based reviewer can never be. Copy this file to .github/workflows/ in
# any Python repo to adopt it — it installs Apex from its own GitHub source
# automatically (see the ADOPTER branch of the "Install Apex" step below); it
# does not install your project.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read           # checkout
  security-events: write   # upload SARIF to the Security tab
  pull-requests: write     # post Apex's verdict as a sticky PR comment

jobs:
  apex-ci:
    runs-on: ubuntu-latest
    steps:
      # Full history so --baseline can diff this change against the base ref.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installs the `apex` console script (and `python -m app.cli`).
      - name: Install Apex
        # SELF-REPO (this workflow running inside Mert544/Apex-orchestrator's
        # own CI): install the checked-out source, dogfooding the exact code
        # under test — byte-identical to the pre-existing behavior.
        # ADOPTER (this file copied into another repo's .github/workflows/):
        # "pip install ." would install the ADOPTER's own project instead of
        # Apex — the `apex` console script would be missing (or a same-named
        # script from the target project would silently run in its place).
        # Install Apex itself from its pinned GitHub source instead.
        env:
          APEX_ADOPTER_REF: main  # pin to a released tag/commit once Apex publishes one (see RELEASING.md)
        run: |
          if [ "${{ github.repository }}" = "Mert544/Apex-orchestrator" ]; then
            pip install .
          else
            pip install "git+https://github.com/Mert544/Apex-orchestrator@${APEX_ADOPTER_REF}"
          fi

      # Zero-config quality gate. Exits non-zero when Apex's deterministic
      # detectors find a security/correctness issue or the health grade fails,
      # which fails the job. Add `--baseline` (after committing a baseline with
      # `apex gate --save-baseline`) to fail only on a REGRESSION vs. that
      # snapshot instead of an absolute bar.
      - name: Apex quality gate
        run: apex gate

      # Export the deterministic review findings as a SARIF 2.1.0 document.
      # Runs even if the gate above failed, so the Security tab is populated on
      # exactly the PRs that need attention.
      - name: Export findings as SARIF
        if: ${{ always() }}
        run: apex review --base "origin/${{ github.base_ref || 'main' }}" --sarif apex.sarif

      # Land the findings on the PR's Security tab (inline, code-scanning alerts).
      - name: Upload SARIF to the Security tab
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: apex.sarif
          category: apex

      # Render Apex's concise, deterministic verdict for the PR itself. A busy
      # maintainer reads one glance: 🟢 clean or 🔴 N high-severity issues, plus
      # the top findings. Zero tokens, fully offline.
      - name: Render Apex review summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: apex review --base "origin/${{ github.base_ref || 'main' }}" --summary > apex-review.md

      # Post that verdict as a STICKY PR comment, updated in place on every push
      # so the PR always shows Apex's current verdict (never a thread of stale ones).
      - name: Post Apex verdict as a sticky PR comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: apex-review
          path: apex-review.md
