name: Dogfood — Apex maintains Apex

# Nightly self-application: the product runs on its own codebase in
# supervised mode (applies test-verified fixes to the working tree, commits
# nothing) and publishes the proof-of-fix evidence artifact. A rollback or a
# tier-gate block is signal, not failure — the job fails only if the run
# itself crashes.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # churn + debt-age signals need history

      # .apex/*.json (dream journal, promotions, idea memory) is gitignored
      # runtime state, so a fresh checkout starts every nightly run amnesiac —
      # PROMOTE_STREAK (app/engine/dream.py) needs 3 CONSECUTIVE nightly dreams
      # to graduate a discovery, which can never accrue without this. Restored
      # before the run, saved after under a fresh per-run key so it always
      # updates (restore-keys falls back to the most recent prior save).
      - name: Restore Apex dream memory (so PROMOTE_STREAK can accrue across nights)
        uses: actions/cache/restore@v4
        with:
          path: |
            .apex/dream-journal.json
            .apex/dream-promotions.json
            .apex/idea-memory.json
          key: apex-dream-memory-${{ github.run_id }}
          restore-keys: |
            apex-dream-memory-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .[dev]

      - name: Baseline suite must be green before self-maintenance
        run: python -m pytest -q

      - name: Apex maintains Apex (supervised, verified, capped)
        run: |
          python -m app.cli auto --apply --max-apply 4 --out .apex/dogfood-report.md

      - name: Rule book holds (saved rewrite rules re-applied if drift returned)
        run: python -m app.cli rewrite --all

      - name: Apex dreams (curate memory, extract patterns, write the digest)
        run: python -m app.cli dream --curate --learn-gates

      - name: Suite still green after self-maintenance
        run: python -m pytest -q

      - name: Show what happened
        if: always()
        run: |
          echo "## Working-tree diff after self-maintenance" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff --stat >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f .apex/dogfood-report.md ]; then
            cat .apex/dogfood-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish proof-of-fix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-evidence
          path: |
            .apex/proof-of-fix.json
            .apex/dogfood-report.md
            .apex/dream-digest.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Save Apex dream memory (so tonight's streak survives to tomorrow)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .apex/dream-journal.json
            .apex/dream-promotions.json
            .apex/idea-memory.json
          key: apex-dream-memory-${{ github.run_id }}
