name: Apex Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Byte-identical characterization tests recover their pre-refactor
      # baseline via `git show <sha>:path`; a shallow clone lacks those
      # commits, so collection ERRORs and the whole job dies before a single
      # test runs (observed live on PR #4). Same fix ci.yml already carries.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # The chunked gate, not a single pytest process: one process holding the
      # whole ~20k-test suite accumulates every module's state and gets OOM-
      # killed on a memory-constrained runner — the exact failure mode
      # scripts/verify.py exists to prevent (each chunk runs in its own
      # process; --no-lint because the CI workflow lints separately).
      - name: Run test suite (chunked gate)
        run: python scripts/verify.py --chunks 16 --no-lint

  security-audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Apex security audit
        run: python scripts/security_audit.py

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-security-report
          path: .apex/security-report.json
